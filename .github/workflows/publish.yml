name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      DOTNET_PROCESSOR_COUNT: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and master ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Use a version tag such as v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::The tagged commit must belong to master."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Restore original release bundle on retry
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release.py restore artifacts/release

      - name: Build
        if: steps.bundle.outputs.reused != 'true'
        run: dotnet build SwiftDispatch.slnx -c Release -p:Version="$PACKAGE_VERSION" --disable-build-servers -m:1

      - name: Test
        if: steps.bundle.outputs.reused != 'true'
        run: |
          dotnet test tests/SwiftDispatch.Tests -c Release --no-build
          dotnet test tests/SwiftDispatch.FluentValidation.Tests -c Release --no-build
          dotnet test tests/SwiftDispatch.EntityFrameworkCore.Tests -c Release --no-build

      - name: Pack
        if: steps.bundle.outputs.reused != 'true'
        run: |
          dotnet pack src/SwiftDispatch.Contracts -c Release --no-build --disable-build-servers -m:1 -p:Version="$PACKAGE_VERSION" -o artifacts/release
          dotnet pack src/SwiftDispatch -c Release --no-build --disable-build-servers -m:1 -p:Version="$PACKAGE_VERSION" -o artifacts/release
          dotnet pack src/SwiftDispatch.FluentValidation -c Release --no-build --disable-build-servers -m:1 -p:Version="$PACKAGE_VERSION" -o artifacts/release
          dotnet pack src/SwiftDispatch.EntityFrameworkCore -c Release --no-build --disable-build-servers -m:1 -p:Version="$PACKAGE_VERSION" -o artifacts/release

      - name: Restore SBOM tool
        run: dotnet tool restore

      - name: Generate and validate package SBOMs
        if: steps.bundle.outputs.reused != 'true'
        run: python3 eng/sbom.py generate artifacts/release

      - name: Save original release outputs before publication
        if: steps.bundle.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90

      - name: Upload and verify draft release SBOM assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release.py stage artifacts/release

      - name: Log in to NuGet.org
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release.py packages artifacts/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release.py publish artifacts/release
