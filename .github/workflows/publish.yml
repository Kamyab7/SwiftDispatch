name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to recover (for example v2.1.1)
        required: true
        type: string
      original_run_id:
        description: Original tag-triggered run containing the release-bundle artifact
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      DOTNET_PROCESSOR_COUNT: 2
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      RELEASE_SOURCE_RUN_ID: ${{ inputs.original_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and master ancestry
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Use a version tag such as v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" != master ]]; then
            echo "::error::Run release recovery from master to use the reviewed release tools."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && ! "$RELEASE_SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Recovery requires the original tag-triggered workflow run ID."
            exit 1
          fi
          git fetch origin master
          release_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$release_commit" origin/master; then
            echo "::error::The tagged commit must belong to master."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == push && "$release_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The release tag must match the checked-out commit."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Restore original release bundle on retry
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file eng/release.cs -- restore artifacts/release

      - name: Build
        if: steps.bundle.outputs.reused != 'true'
        run: dotnet build TrueMediator.slnx -c Release -p:Version="$PACKAGE_VERSION" --disable-build-servers -m:1

      - name: Test
        if: steps.bundle.outputs.reused != 'true'
        run: |
          dotnet test tests/TrueMediator.Tests -c Release --no-build
          dotnet test tests/TrueMediator.FluentValidation.Tests -c Release --no-build
          dotnet test tests/TrueMediator.EntityFrameworkCore.Tests -c Release --no-build

      - name: Pack
        if: steps.bundle.outputs.reused != 'true'
        run: |
          dotnet pack src/TrueMediator.Contracts -c Release --no-build --disable-build-servers -m:1 -p:Version="$PACKAGE_VERSION" -o artifacts/release
          dotnet pack src/TrueMediator -c Release --no-build --disable-build-servers -m:1 -p:Version="$PACKAGE_VERSION" -o artifacts/release
          dotnet pack src/TrueMediator.FluentValidation -c Release --no-build --disable-build-servers -m:1 -p:Version="$PACKAGE_VERSION" -o artifacts/release
          dotnet pack src/TrueMediator.EntityFrameworkCore -c Release --no-build --disable-build-servers -m:1 -p:Version="$PACKAGE_VERSION" -o artifacts/release

      - name: Restore SBOM tool
        run: dotnet tool restore

      - name: Generate and validate package SBOMs
        if: steps.bundle.outputs.reused != 'true'
        run: dotnet run --file eng/sbom.cs -- generate artifacts/release

      - name: Save original release outputs before publication
        if: steps.bundle.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90

      - name: Upload and verify draft release SBOM assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file eng/release.cs -- stage artifacts/release

      - name: Log in to NuGet.org
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file eng/release.cs -- packages artifacts/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file eng/release.cs -- publish artifacts/release
